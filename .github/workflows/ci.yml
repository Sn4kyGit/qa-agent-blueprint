name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run bash fixture battery
        run: |
          fails=0
          for t in .claude/hooks/tests/*.sh; do
            echo "=== $(basename $t) ==="
            if bash "$t" 2>&1 | tail -1; then :; else fails=$((fails+1)); fi
          done
          [ "$fails" -eq 0 ]

      - name: Run bun tests
        run: cd opencode && bun test

      - name: Validate plugin manifest
        run: claude plugin validate . 2>&1 || true
