<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic Checkout</title></head>
<body>
  <main>
    <h1>Synthetic Checkout</h1>
    <form id="checkout-form">
      <label for="item">Item</label>
      <input id="item" name="item" value="synthetic-widget" readonly>
      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number" value="1" min="1" max="1" readonly>
      <button type="submit">Place order</button>
    </form>
    <p id="order-result" role="status" aria-live="polite"></p>
    <script>
      document.querySelector('#checkout-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({item: 'synthetic-widget', quantity: 1})
        });
        const body = await response.json();
        document.querySelector('#order-result').textContent = response.status === 201
          ? `Order ${body.id} confirmed, total ${body.total} credits`
          : `Order rejected: ${body.error}`;
      });
    </script>
  </main>
</body>
</html>
